server:
  port: 8080

spring:
  application:
    name: ticket-system

  datasource:
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  # 告诉 MyBatis-Plus 去哪找 XML 映射文件
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 数据库字段 create_time → Java 属性 createTime 自动映射
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: ticket-system-secret-key-change-in-production
  expire: 86400  # 24h

# ========== 业务参数 ==========
ticket:
  order:
    pay-timeout-seconds: 1800   # 订单支付超时（秒），默认30分钟
  rate-limit:
    max-per-second: 3           # 每秒最多抢票次数
    burst: 3                    # 突发允许的峰值
  stock:
    warmup-enabled: true        # 启动时是否预热库存到 Redis

# Prometheus / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
